<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Proč to zní</title>
<meta name="theme-color" content="#1c4634">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Proč to zní">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<nav class="nav" id="nav" aria-label="Menu">
  <div class="brand">Proč to zní</div>
  <button data-v="song"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><span data-t="tSong"></span></button>
  <button data-v="five"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2h5M12 2v3"/></svg><span data-t="tFive"></span></button>
  <button data-v="lessons"><svg viewBox="0 0 24 24"><path d="M3 5.5C5.5 4 9 4 12 6c3-2 6.5-2 9-.5V19c-2.5-1.5-6-1.5-9 .5-3-2-6.5-2-9-.5z"/><path d="M12 6v13.5"/></svg><span data-t="tLes"></span></button>
  <button data-v="tuner"><svg viewBox="0 0 24 24"><path d="M3.5 16a8.5 8.5 0 1 1 17 0"/><path d="M12 16l4-6"/><circle cx="12" cy="16" r="1.4"/></svg><span data-t="tTune"></span></button>
  <button data-v="more"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span data-t="tMore"></span></button>
</nav>

<main>
<section id="v-song">
  <div class="songbar">
    <button class="pick" id="pick"><span id="pickN"></span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
  <div class="seg3" id="sub"><button data-s="play" data-t="subPlay"></button><button data-s="chords" data-t="subChords"></button><button data-s="solo" data-t="subSolo"></button></div>
  <div id="p-play"></div>
  <div id="p-chords" hidden>
    <div id="rozbor"></div>
    <h2 class="sh2" data-t="whyT"></h2>
    <p class="t" data-t="whySub" style="margin-bottom:10px"></p>
    <div class="faq" id="faq"></div>
    <div id="aiBox" hidden style="margin-top:18px">
      <div class="lbl" data-t="ask"></div>
      <textarea id="aq" rows="2"></textarea>
      <button class="fire" id="ab" data-t="askBtn"></button>
      <div class="ans" id="aa" aria-live="polite"></div>
    </div>
  </div>
  <div id="p-solo" hidden>
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <div class="seg" id="mode"><button data-m="pent"></button><button data-m="scale"></button><button data-m="chord"></button></div>
      <div class="seg" id="lab"><button data-l="name"></button><button data-l="deg"></button></div>
    </div>
    <div class="fbwrap"><div class="fb" id="fb1"><svg></svg></div></div>
    <p class="cap" id="fbc"></p>
  </div>
</section>

<section id="v-five" hidden><div id="fiveC"></div></section>

<section id="v-lessons" hidden>
  <div class="lhead"><div><h1 class="vt" data-t="tLes"></h1><p class="muted" id="lesSong"></p></div><button id="lesAll"></button></div>
  <div class="lpath" id="lpath"></div>
  <div class="lesson" id="lesson"></div>
  <div class="lbar" id="lbar"></div>
  <div class="ov" id="lesOv" hidden><div class="box"><div class="row" style="justify-content:space-between"><h2 data-t="allLes"></h2><button id="lesOvX" aria-label="×">✕</button></div><div class="ll" id="ll"></div></div></div>
</section>

<section id="v-tuner" hidden>
  <h1 class="vt" data-t="tTune"></h1>
  <div class="tun">
    <div class="dial">
      <svg viewBox="0 0 300 170" aria-hidden="true">
        <path d="M30 150 A120 120 0 0 1 270 150" fill="none" stroke="#ffffff30" stroke-width="16" stroke-linecap="round"/>
        <path d="M137.5 30.6 A120 120 0 0 1 162.5 30.6" fill="none" stroke="#5cc493" stroke-width="16"/>
        <g id="ticks"></g>
        <g id="needle"><line x1="150" y1="150" x2="150" y2="38" stroke="#ff5a1f" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="150" r="10" fill="#ff5a1f"/></g>
        <text x="30" y="168" fill="#cfe3d7" font-size="14" text-anchor="middle">−50</text><text x="270" y="168" fill="#cfe3d7" font-size="14" text-anchor="middle">+50</text>
      </svg>
      <div class="tnote" id="tnote">–</div>
      <div class="thint" id="thint"></div>
      <div class="strs" id="strs"></div>
      <div class="row" style="justify-content:center;margin-top:16px"><button class="fire" data-mic></button></div>
      <p class="t micmsg" style="color:#cfe3d7;margin-top:8px"></p>
    </div>
    <div class="panel">
      <label for="tuning" data-t="tuningL"></label>
      <select id="tuning"></select>
      <p class="t" data-t="playStr" style="margin-top:12px"></p>
      <label class="sw"><input type="checkbox" id="tauto" checked> <span data-t="auto"></span></label>
      <label class="sw"><input type="checkbox" id="tref" checked> <span data-t="refTone"></span></label>
    </div>
  </div>
</section>

<section id="v-more" hidden>
  <h1 class="vt" data-t="tMore"></h1>
  <div class="more">
    <div class="panel met">
      <div class="lbl" data-t="metro"></div>
      <div class="big"><span id="bpm">80</span> <small>BPM</small></div>
      <div class="dots" id="dots"></div>
      <input type="range" id="br" min="40" max="220" value="80" aria-label="BPM">
      <div class="row"><button class="sq" id="bm" aria-label="-">−</button><button class="pri" id="go"></button><button id="tap" data-t="tap"></button><button class="sq" id="bp" aria-label="+">+</button></div>
      <div class="row" style="margin-top:10px;justify-content:center"><span class="muted" data-t="beats"></span><div class="seg" id="bt"><button data-b="2">2</button><button data-b="3">3</button><button data-b="4">4</button><button data-b="6">6</button></div></div>
    </div>
    <div class="panel set">
      <div><div class="lbl" data-t="langL"></div><div class="seg" id="lang"><button data-l="cs">Čeština</button><button data-l="en">English</button></div></div>
      <div><div class="lbl" data-t="notL"></div><div class="seg" id="notn"><button data-n="h"></button><button data-n="b"></button></div></div>
      <div><div class="lbl" data-t="plL"></div><div class="seg" id="plvls"></div></div>
      <div><div class="lbl" data-t="lvlL"></div><div class="seg" id="lvls"></div></div>
      <label class="sw"><input type="checkbox" id="lefty"> <span data-t="leftyL"></span></label>
    </div>
    <div class="panel">
      <div class="lbl" data-t="bkL"></div>
      <p class="t" data-t="bkHint"></p>
      <textarea id="bkTx" spellcheck="false"></textarea>
      <div class="row"><button id="bkCopy" data-t="bkCopyB"></button><button id="bkLoad" data-t="bkLoadB"></button></div>
      <p class="t" id="bkMsg" style="margin-top:8px"></p>
    </div>
    <div class="panel">
      <button id="reset" data-t="reset"></button>
      <div id="resetQ" hidden style="margin-top:10px"><p class="t" data-t="resetQ"></p><div class="row" style="margin-top:8px"><button class="fire" id="resetY" data-t="yes"></button><button id="resetN" data-t="no"></button></div></div>
    </div>
  </div>
</section>
</main>

<div class="ov" id="songOv" hidden><div class="box" role="dialog" aria-modal="true">
  <div id="sList">
    <div class="row" style="justify-content:space-between"><h2 data-t="songs"></h2><button id="sClose" data-t="close"></button></div>
    <button class="fire" id="sAdd" data-t="addSong" style="margin:10px 0 12px"></button>
    <input type="text" id="sq" autocomplete="off">
    <div class="row" style="margin:8px 0 4px"><span class="muted" data-t="sortL"></span><div class="seg" id="ssort"></div></div>
    <div class="lbl" style="margin-top:12px" data-t="mineL"></div><div class="slist" id="slMine"></div>
    <div class="lbl" style="margin-top:14px" data-t="examples"></div><div class="slist" id="slEx"></div>
  </div>
  <div id="sEdit" hidden>
    <h2 id="sEditT"></h2>
    <label for="nm" data-t="song" style="margin-top:10px"></label>
    <input type="text" id="nm" autocomplete="off" style="margin-bottom:12px">
    <a id="find" class="find" href="https://www.google.com/search?q=akordy" target="_blank" rel="noopener" data-t="find"></a>
    <div class="row" style="justify-content:space-between;align-items:flex-end"><label for="tx" data-t="chordsLbl" style="flex:1"></label><button id="sPaste" data-t="paste" style="margin-bottom:6px"></button></div>
    <textarea id="tx" spellcheck="false" wrap="off"></textarea>
    <div class="det" id="det"></div>
    <div class="row"><button class="pri" id="sSave" data-t="save"></button><button id="sBack" data-t="back"></button><button id="sDel" data-t="del"></button></div>
    <div id="sDelQ" hidden class="confirm"><p data-t="delQ"></p><div class="row"><button class="fire" id="sDelY" data-t="delY"></button><button id="sDelN" data-t="delN"></button></div></div>
  </div>
</div></div>

<div class="ov" id="chOv" hidden><div class="box" role="dialog" aria-modal="true">
  <div class="row" style="justify-content:space-between"><h2 id="chT"></h2><button id="chClose" data-t="close"></button></div>
  <div class="chgrid" id="chB"></div>
  <p class="t" id="chTip"></p>
  <div class="chchk" id="chChk"></div>
</div></div>

<div class="ov" id="impOv" hidden><div class="box" role="dialog" aria-modal="true">
  <div class="lbl" data-t="importT"></div><h2 id="impN"></h2><div class="sheetv imp" id="impTx"></div>
  <div class="row" style="margin-top:14px"><button class="fire" id="impY" data-t="importAdd"></button><button id="impN2" data-t="importNo"></button></div>
</div></div>
<div class="campbar" id="campBar" hidden><div class="cgrp"><button class="sq" id="cfm" aria-label="A-">A−</button><output id="cFs"></output><button class="sq" id="cfp" aria-label="A+">A+</button></div><button class="pri" id="cScr"></button><div class="cgrp"><button class="sq" id="csm" aria-label="slower">🐢</button><output id="cSpd"></output><button class="sq" id="csp" aria-label="faster">🐇</button></div><button id="cExit" data-t="campExit"></button></div>
<div class="toast" id="toast" hidden role="status"><span id="toastT"></span><button id="toastB"></button></div>
<div class="sheet" id="sheet" hidden role="dialog"><h3 id="shT"></h3><p id="shX"></p><div class="row"><button class="fire" id="shA" hidden></button><button id="shC"></button></div></div>
<div class="ov" id="ov" hidden><div class="box" role="dialog" aria-modal="true">
  <div class="row" style="justify-content:flex-end"><div class="seg" id="lang2"><button data-l="cs">CZ</button><button data-l="en">EN</button></div></div>
  <h2 data-t="lvlT"></h2><p class="muted" data-t="lvlN"></p>
  <div class="lbl obq" data-t="playQ"></div><div class="lv" id="lvP"></div>
  <div class="lbl obq" data-t="theoryQ"></div><div class="lv" id="lv"></div>
  <button class="fire big1" id="obDone" data-t="okGo"></button>
</div><div class="box" id="obMic" hidden role="dialog" aria-modal="true">
  <div class="micbig" aria-hidden="true">🎤</div>
  <h2 data-t="micT"></h2><p class="muted" data-t="micWhy"></p>
  <button class="fire big1" id="obMicY" data-t="micAllow"></button>
  <p class="t" id="obMicMsg"></p>
  <button class="link" id="obMicN" data-t="micLater"></button>
</div></div>

<script src="js/core.js"></script>
<script src="js/i18n.js"></script>
<script src="js/chords.js"></script>
<script src="js/lessons.js"></script>
<script src="js/song.js"></script>
<script src="js/train.js"></script>
<script src="js/quest.js"></script>
<script src="js/tuner.js"></script>
<script src="js/main.js"></script>
</body>
</html>
