<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proč to zní</title>
<meta name="theme-color" content="#1c4634">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Proč to zní">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday hobby tool, friendly, few words, learning by ear
   IDEA a campfire songbook laid on a guitar neck: chords on top, the neck below shows where they live
   PICTURE the rosewood fretboard with lit notes, plus chord cards named by their role
   COLOUR forest green band, white ground, fire orange for "home", pearl inlays, rosewood
   TYPE Barlow Condensed for names and chords, Barlow for text
   LAYOUT laptop: input left, analysis right, neck full width; phone: title, songs, analysis, neck, input */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1512);--ink:light-dark(#14201a,#ecf1ed);--mut:light-dark(#55635b,#9fb0a6);--forest:light-dark(#1c4634,#12301f);--panel:light-dark(#f3f6f3,#16211b);--line:light-dark(#d5ddd7,#2a3a31);--fire:#ff5a1f;--fireInk:light-dark(#c63d0b,#ff8a5c);--wood:#3a2318;--pearl:#f5efe2;--leaf:light-dark(#2e7a57,#5cc493);--bad:light-dark(#b42318,#ff8577)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
.band{padding-block:clamp(22px,3.4vw,48px);padding-inline:max(5vw,16px)}
.in{max-width:1240px;margin:0 auto}
h1,h2,.key,.cn,.big{font-family:"Barlow Condensed",Barlow,sans-serif;letter-spacing:-.01em;line-height:1.05;margin:0}
[hidden]{display:none!important}
.top{background:var(--forest);color:#fff;padding-bottom:20px}
.hrow{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.top h1{font-size:clamp(36px,5vw,52px)}
.top p{margin:4px 0 0;color:#cfe3d7}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top .seg{background:transparent;border-color:#ffffff55}
.top .seg button{background:transparent;color:#fff}
.top .seg button.on{background:#fff;color:var(--forest)}
.lvb{background:transparent;color:#fff;border-color:#ffffff55}
.tabs{display:flex;gap:6px;margin-top:18px;border-bottom:1px solid #ffffff33}
.tabs button{background:transparent;color:#cfe3d7;border:0;border-bottom:3px solid transparent;border-radius:0;font:700 20px "Barlow Condensed",sans-serif;padding:0 14px}
.tabs button.on{color:#fff;border-bottom-color:var(--fire)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{border:1px solid #ffffff55;background:transparent;color:#fff;border-radius:999px;padding:9px 15px;font:500 15px Barlow,sans-serif;min-height:42px;cursor:pointer}
.chip.on{background:#fff;color:var(--forest);border-color:#fff}
.chip.add{border-style:dashed}
.top .note{font-size:13px;color:#b9d3c4;margin-top:10px}
.work .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:28px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
label,.lbl{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mut);font-weight:500;margin:0 0 6px}
input[type=text],textarea{width:100%;font:16px/1.45 Barlow,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
#tx{resize:vertical;min-height:170px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--fire);outline-offset:2px}
.find{display:inline-flex;align-items:center;min-height:44px;margin:-8px 0 8px;color:var(--leaf);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:600 15px Barlow,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--mut)}
button.pri{background:var(--forest);color:#fff;border-color:var(--forest)}
button.fire{background:var(--fire);color:#fff;border-color:var(--fire)}
button.sq{width:44px;padding:0;font-size:20px}
.q{width:30px;height:30px;min-height:30px;padding:0;border-radius:50%;font-size:14px;color:var(--leaf);border-color:currentColor;background:transparent;flex:none}
.set{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.set output{min-width:2.6em;text-align:center;font:700 20px "Barlow Condensed",sans-serif}
.sw{margin:12px 0 0;color:var(--ink);font-size:15px;cursor:pointer}
.sw input{width:20px;height:20px;accent-color:var(--forest)}
.msg{font-size:14px;color:var(--leaf);min-height:20px;margin-top:8px}
.keyrow{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.key{font-size:clamp(44px,6vw,64px);font-weight:700}
.key b{color:var(--fireInk);font-weight:700}
.muted{color:var(--mut);font-size:15px}
.t{font-size:14px;color:var(--mut);margin:0}
.pat{margin-top:20px;border-left:4px solid var(--fire);padding:4px 0 4px 16px}
.pat .big{font-size:28px;font-weight:700}
.pat p{margin:6px 0}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0}
.path i{font-style:normal;color:var(--mut);font-size:18px}
.pc{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;padding:5px 10px;background:var(--bg);transition:background .15s}
.pc b{font:700 22px "Barlow Condensed",sans-serif;line-height:1.1}
.pc small{font-size:13px;color:var(--mut)}
.pc.home{border-color:var(--fire)}
.pc.lit,.cd.lit{background:var(--fire);border-color:var(--fire);color:#fff}
.pc.lit small{color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;margin:22px 0 14px}
.cd{text-align:left;padding:10px 12px 12px;height:auto;border-radius:12px;border:2px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:2px;transition:background .15s}
.cd .num{font:700 15px "Barlow Condensed",sans-serif;color:var(--mut)}
.cd .cn{font-size:30px;font-weight:700}
.cd .fn{font:500 14px Barlow,sans-serif;color:var(--mut)}
.cd.home{border-color:var(--fire)}
.cd.home .num,.cd.home .fn{color:var(--fireInk)}
.cd.on{background:var(--forest);border-color:var(--forest);color:#fff}
.cd.on .num,.cd.on .fn,.cd.lit .num,.cd.lit .fn{color:#fff}
.sel{background:var(--panel);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 16px;align-items:center}
.sel .cn{font-size:40px;font-weight:700;grid-row:span 2}
.sel p{margin:0}
.sel button{grid-row:span 2}
.capo{margin-top:18px}
.caps{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.cp{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.cp b{font:700 18px "Barlow Condensed",sans-serif;display:block}
.cp span{font:600 18px "Barlow Condensed",sans-serif;color:var(--fireInk);word-spacing:4px}
.empty{color:var(--mut);padding:20px 0}
.board{background:light-dark(#efe7dc,#17110d)}
.bh{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:14px}
.bh h2{font-size:clamp(28px,3.4vw,38px)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.seg button{border:0;border-radius:0;min-height:42px;font-size:14px;padding:0 13px}
.seg button.on{background:var(--wood);color:var(--pearl)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fb{position:relative;width:max(100%,780px);height:260px}
.fb>svg{position:absolute;inset:0;width:100%;height:100%}
.cap{margin:12px 0 0;font-size:16px}
.cap b{color:var(--fireInk)}
.low .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:28px;align-items:start}
.met .big{font-size:64px;font-weight:700;text-align:center}
.met .big small{font-size:20px;color:var(--mut)}
.dots{display:flex;justify-content:center;gap:10px;margin:8px 0 14px}
.dot{width:18px;height:18px;border-radius:50%;background:var(--line)}
.dot.hit{background:var(--leaf)}
.dot.hit.one{background:var(--fire)}
input[type=range]{width:100%;accent-color:var(--fire);height:32px;margin:4px 0 12px}
.met .row{justify-content:center}
.ask h2{font-size:30px}
.faq{display:grid;gap:8px;margin-top:12px}
.fq{border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.fq summary{cursor:pointer;padding:12px 14px;font-weight:600;min-height:44px;list-style-position:inside}
.fq[open] summary{color:var(--fireInk)}
.fq div{padding:0 14px 14px}
.fq p{margin:0 0 10px}
.fq p b{color:var(--fireInk)}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.sugg button{font-weight:500;text-align:left;height:auto;padding:8px 12px;min-height:40px}
#aq{min-height:64px;resize:vertical;margin-bottom:10px}
.ans{white-space:pre-wrap;margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.ans:empty{display:none}
.les .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:28px;align-items:start}
.ll{display:flex;flex-direction:column;gap:8px}
.ll button{text-align:left;display:flex;gap:10px;align-items:center;justify-content:flex-start;height:auto;padding:10px 12px}
.ll button .n{width:28px;height:28px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-weight:700;flex:none}
.ll button.dn .n{background:var(--leaf);color:#fff}
.ll button.on{border-color:var(--forest);border-width:2px}
.lesson h2{font-size:clamp(32px,4vw,44px);margin:2px 0 12px}
.lesson .body{font-size:18px;max-width:62ch}
.lesson .body b{color:var(--fireInk)}
.exp{margin:18px 0 6px;padding:14px 16px;border-radius:12px;background:var(--panel)}
.exp .row{margin-top:10px}
.quiz{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.quiz .qq{font:700 22px "Barlow Condensed",sans-serif;margin:0 0 10px}
.opts{display:grid;gap:8px;max-width:520px}
.opts button{text-align:left;justify-content:flex-start;font-weight:500}
.opts button.ok{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.opts button.no{border-color:var(--bad);color:var(--bad)}
.qfb{min-height:24px;margin:10px 0 0}
.nav{margin-top:18px}
.ov{position:fixed;inset:0;background:#0b1410cc;display:grid;place-items:center;padding:16px;z-index:20}
.box{background:var(--bg);color:var(--ink);border-radius:16px;padding:24px;max-width:520px;width:100%;max-height:100%;overflow:auto}
.box h2{font-size:34px;margin-bottom:6px}
.lv{display:grid;gap:10px;margin:16px 0}
.lv button{text-align:left;height:auto;padding:12px 16px;display:block}
.lv b{display:block;font:700 22px "Barlow Condensed",sans-serif}
.lv span{color:var(--mut);font-weight:500}
.sheet{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 10px 30px #0004;z-index:15}
.sheet h3{margin:0 0 6px;font:700 24px "Barlow Condensed",sans-serif}
.sheet p{margin:0 0 12px}
@media(max-width:860px){.work .in,.low .in,.les .in{grid-template-columns:minmax(0,1fr)}.work .inp{order:2}.sel{grid-template-columns:auto minmax(0,1fr)}.sel button{grid-row:auto;grid-column:1/-1;justify-self:start}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="band top"><div class="in">
  <div class="hrow">
    <div><h1>Proč to zní</h1><p data-t="sub"></p></div>
    <div class="ctl"><div class="seg" id="lang"><button data-l="cs">CZ</button><button data-l="en">EN</button></div><button class="lvb" id="lvb"></button></div>
  </div>
  <div class="tabs"><button id="tabS" data-t="tabSong"></button><button id="tabL"></button></div>
  <div class="chips" id="chips"></div>
  <p class="note" data-t="note"></p>
</div></header>

<div id="vSong">
<main class="band work"><div class="in">
  <section class="panel inp">
    <label for="nm" data-t="song"></label>
    <input type="text" id="nm" autocomplete="off">
    <a id="find" class="find" href="https://www.google.com/search?q=akordy" target="_blank" rel="noopener" data-t="find"></a>
    <label for="tx" data-t="chordsLbl"></label>
    <textarea id="tx" spellcheck="false"></textarea>
    <div class="row"><button class="pri" id="save" data-t="save"></button><button id="new" data-t="newS"></button><button id="del" data-t="del"></button></div>
    <div class="msg" id="msg"></div>
    <div class="row set"><span data-t="transp"></span><button class="sq" id="tm" aria-label="-1">−</button><output id="to">0</output><button class="sq" id="tp" aria-label="+1">+</button><button id="t0" data-t="back"></button></div>
    <label class="sw"><input type="checkbox" id="cz"> <span data-t="notation"></span></label>
  </section>
  <section id="ana"></section>
</div></main>

<section class="band board" id="board"><div class="in">
  <div class="bh">
    <h2 id="fbt"></h2>
    <div class="row">
      <div class="seg" id="mode"><button data-m="pent"></button><button data-m="scale"></button><button data-m="chord"></button></div>
      <div class="seg" id="lab"><button data-l="name"></button><button data-l="deg"></button></div>
    </div>
  </div>
  <div class="scroll"><div class="fb" id="fb"><svg id="fs" aria-label="Fretboard"></svg></div></div>
  <p class="cap" id="fbc"></p>
</div></section>

<section class="band low"><div class="in">
  <div class="panel met">
    <div class="lbl" data-t="metro"></div>
    <div class="big"><span id="bpm">80</span> <small>BPM</small></div>
    <div class="dots" id="dots"></div>
    <input type="range" id="br" min="40" max="220" value="80" aria-label="BPM">
    <div class="row"><button class="sq" id="bm" aria-label="-">−</button><button class="pri" id="go"></button><button id="tap" data-t="tap"></button><button class="sq" id="bp" aria-label="+">+</button></div>
    <div class="row" style="margin-top:10px"><span class="muted" data-t="beats"></span><div class="seg" id="bt"><button data-b="2">2</button><button data-b="3">3</button><button data-b="4">4</button><button data-b="6">6</button></div></div>
  </div>
  <section class="panel ask" id="askP">
    <h2 data-t="why"></h2>
    <p class="t" data-t="whySub"></p>
    <div class="faq" id="faq"></div>
    <div id="aiBox" hidden>
      <div class="lbl" style="margin-top:18px" data-t="ask"></div>
      <textarea id="aq" rows="2"></textarea>
      <button class="fire" id="ab" data-t="askBtn"></button>
      <div class="ans" id="aa" aria-live="polite"></div>
    </div>
  </section>
</div></section>
</div>

<div id="vLes" hidden>
<section class="band les"><div class="in">
  <div class="ll" id="ll"></div>
  <div class="lesson" id="lesson"></div>
</div></section>
</div>

<div class="sheet" id="sheet" hidden role="dialog"><h3 id="shT"></h3><p id="shX"></p><div class="row"><button class="fire" id="shA" hidden></button><button id="shC"></button></div></div>
<div class="ov" id="ov" hidden><div class="box" role="dialog" aria-modal="true">
  <div class="row" style="justify-content:flex-end"><div class="seg" id="lang2"><button data-l="cs">CZ</button><button data-l="en">EN</button></div></div>
  <h2 data-t="lvlT"></h2><p class="muted" data-t="lvlN"></p>
  <div class="lv" id="lv"></div>
</div></div>

<script>

  it.push([tr(`Proč je tu akord ${n(u)}?`,`Why is the ${n(u)} chord here?`),a,pbtn(`▶ ${cname(u)} → ${cname(I)}`,[u,I])])}
 it.push([tr('Jak ji zahrát co nejjednodušeji?','How can I play it the easiest way?'),
  best.k?tr(`Dej kapodastr na <b>${best.k}. pražec</b> a hraj tvary <b>${shapes}</b>. Zní to stejně jako originál.`,`Put a capo on <b>fret ${best.k}</b> and play the shapes <b>${shapes}</b>. It sounds the same as the original.`):tr(`Nejsnazší je to bez kapodastru: <b>${shapes}</b>.`,`It’s easiest without a capo: <b>${shapes}</b>.`),'']);
 it.push([tr('Kterým akordem písničku ukončit?','Which chord should I end on?'),
  tr(`Akordem <b>${n(I)}</b>, to je domov. Když skončíš jinde, písnička zůstane viset ve vzduchu.`,`On <b>${n(I)}</b>, that’s home. End anywhere else and the song hangs in the air.`),
  pbtn(tr('▶ Konec doma','▶ End at home'),[IV,V,I])+pbtn(tr('▶ Konec jinde','▶ End elsewhere'),[IV,I,V])]);
 el.innerHTML=it.map(([q,a,b])=>`<details class="fq"><summary>${q}</summary><div><p>${a}</p>${b?`<div class="row">${b}</div>`:''}</div></details>`).join('');
 regN=keep;
}
let askCtl=null;
async function ask(q){
 if(!sample||!q.trim())return;if(askCtl)askCtl.abort();askCtl=new AbortController();const {k,us}=A,aa=$('aa');aa.textContent=X().asking;
 const lv={beg:'complete beginner in music theory (plays chords by ear, knows no theory terms)',mid:'knows what major and minor are, little else',adv:'knows degrees and scales'}[level||'beg'];
 const ctx=k?`Song: ${$('nm').value.trim()||'untitled'}\nChords in order: ${seq().map(c=>cname(c)).join(' ')}\nDetected key: ${keyName(k)}\nChord roles: ${us.map(u=>{const r=role(u,k);return cname(u)+' = '+r.num+' ('+r.word+')'}).join(', ')}`:'No song loaded.';
 const prompt=`You are a warm, practical guitar teacher inside the app "Proč to zní" that teaches music theory through songs the student already plays.\nStudent: ${lv}.\nAnswer in ${lang==='cs'?'Czech':'English'}.${cz?' Use Czech/German chord names: H means B natural, B means B flat.':''}\nRules: max 5 short sentences, or up to 4 short lines. Plain everyday words; if you use a theory term, explain it in brackets in a few words. Tie the answer to the student's song and chords. Suggest something to try on the guitar or listen for when useful. No markdown symbols, no headings.\n\n${ctx}\n\nQuestion: ${q}`;
 try{const r=await sample(prompt,{signal:askCtl.signal,cache:false,onText:({text})=>{aa.textContent=text}});aa.textContent=r.text}
 catch(e){if(e&&e.name==='AbortError')return;if(e&&e.code==='not_granted'){sample=null;renderAsk();return}aa.textContent=X().askErr}
}
$('ab').onclick=()=>ask($('aq').value);
(async()=>{try{const s=window.claude&&window.claude.use?await window.claude.use('sample'):null;if(s){sample=s;renderAsk()}}catch(e){}})();

/* ---------- glossary sheet ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;e.stopPropagation();const g=GL[b.dataset.g][lang==='cs'?0:1];sheetTerm=g[0];
 $('shT').textContent=g[0];$('shX').textContent=g[1];$('shA').hidden=!sample;$('shA').textContent=X().askMore;$('shC').textContent=X().close;$('sheet').hidden=false});
$('shC').onclick=()=>{$('sheet').hidden=true};
$('shA').onclick=()=>{$('sheet').hidden=true;setView('song');const q=tr(`Vysvětli mi na téhle písničce: ${sheetTerm}`,`Explain using this song: ${sheetTerm}`);$('aq').value=q;$('aiBox').scrollIntoView({behavior:'smooth'});ask(q)};

/* ---------- views, language, level ---------- */
function renderTabs(){$('tabL').textContent=X().tabLes+` ${done.length}/6`;$('tabS').classList.toggle('on',view==='song');$('tabL').classList.toggle('on',view==='les')}
function setView(v){view=v;stopPlay();$('vSong').hidden=v!=='song';$('vLes').hidden=v!=='les';renderTabs();chips();if(v==='les')renderLes();else draw()}
$('tabS').onclick=()=>setView('song');$('tabL').onclick=()=>setView('les');
function applyLang(){
 const x=X();document.documentElement.lang=lang;
 document.querySelectorAll('[data-t]').forEach(el=>{const v=x[el.dataset.t];if(typeof v==='string')el.textContent=v});
 $('tx').placeholder=x.ph;$('go').textContent=timer?x.stopM:x.start;
 document.querySelectorAll('#lang button,#lang2 button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
 $('lvb').textContent=x.lvlBtn+': '+(level?x.lv[level][0]:'–');
 $('lv').innerHTML=Object.entries(x.lv).map(([kk,[a,b]])=>`<button data-lv="${kk}"><b>${a}</b><span>${b}</span></button>`).join('');
 $('cz').checked=cz;renderTabs();upd();update();
}
function setLang(l){if(l===lang)return;lang=l;cz=l==='cs';store.set('pcz-lang',lang);store.set('pcz-cz',cz);applyLang()}
$('lang').onclick=e=>{const b=e.target.closest('button');if(b)setLang(b.dataset.l)};
$('lang2').onclick=e=>{const b=e.target.closest('button');if(b)setLang(b.dataset.l)};
$('lvb').onclick=()=>{$('ov').hidden=false};
$('lv').onclick=e=>{const b=e.target.closest('[data-lv]');if(!b)return;level=b.dataset.lv;store.set('pcz-level',level);$('ov').hidden=true;applyLang()};

$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){load(b.dataset.id);if(view==='les')renderLes()}});
$('ana').addEventListener('click',e=>{const b=e.target.closest('.cd');if(!b)return;selIdx=+b.dataset.i;mode='chord';renderAna();draw();play([A.us[selIdx]])});
$('tx').addEventListener('input',()=>{selIdx=0;update()});$('nm').addEventListener('input',()=>{upd();renderAsk()});
$('tm').onclick=()=>{shift=Math.max(-11,shift-1);update()};$('tp').onclick=()=>{shift=Math.min(11,shift+1);update()};$('t0').onclick=()=>{shift=0;update()};
$('cz').onchange=e=>{cz=e.target.checked;store.set('pcz-cz',cz);update()};
$('mode').onclick=e=>{const b=e.target.closest('button');if(b){mode=b.dataset.m;draw()}};
$('lab').onclick=e=>{const b=e.target.closest('button');if(b){lab=b.dataset.l;draw()}};
$('save').onclick=()=>{const name=$('nm').value.trim()||'—',text=$('tx').value;let s=mine.find(v=>v.id===cur);
 if(s){s.name=name;s.text=text}else{s={id:'m'+Date.now(),name,text};mine.push(s);cur=s.id}store.set('pcz-songs',mine);chips();$('msg').textContent=X().saved};
$('new').onclick=()=>{load('');$('nm').focus()};
$('del').onclick=()=>{if(!mine.some(v=>v.id===cur)){$('msg').textContent=X().noDel;return}mine=mine.filter(v=>v.id!==cur);store.set('pcz-songs',mine);load('x1')};

/* ---------- metronome ---------- */
let bpm=store.get('pcz-bpm',80),beats=4,timer=null,nextT=0,beat=0,taps=[],mg=null;
function setB(v){bpm=Math.max(40,Math.min(220,Math.round(v)));$('bpm').textContent=bpm;$('br').value=bpm;store.set('pcz-bpm',bpm)}
function dots(){$('dots').innerHTML=Array.from({length:beats},()=>'<span class="dot"></span>').join('');document.querySelectorAll('#bt button').forEach(b=>b.classList.toggle('on',+b.dataset.b===beats))}
function click(t,b){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=b===0?1600:1000;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+.05);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.06);
 setTimeout(()=>{document.querySelectorAll('.dot').forEach((d,i)=>{d.classList.toggle('hit',i===b);d.classList.toggle('one',i===0)})},Math.max(0,(t-ac.currentTime)*1000))}
function tick(){while(nextT<ac.currentTime+.1){click(nextT,beat);nextT+=60/bpm;beat=(beat+1)%beats}}
$('go').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('go').textContent=X().start;document.querySelectorAll('.dot').forEach(d=>d.classList.remove('hit'));return}
 try{actx();nextT=ac.currentTime+.06;beat=0;timer=setInterval(tick,25);$('go').textContent=X().stopM}catch(e){}};
$('br').oninput=e=>setB(+e.target.value);$('bm').onclick=()=>setB(bpm-1);$('bp').onclick=()=>setB(bpm+1);
$('bt').onclick=e=>{const b=e.target.closest('button');if(b){beats=+b.dataset.b;beat=0;dots()}};
$('tap').onclick=()=>{const n=performance.now();taps=taps.filter(t=>n-t<2500);taps.push(n);if(taps.length>1)setB(60000/((taps[taps.length-1]-taps[0])/(taps.length-1)))};

setB(bpm);dots();
const s0=EXAMPLES[0];$('nm').value=s0.name;$('tx').value=s0.text;
applyLang();setView('song');
if(!level)$('ov').hidden=false;
}
</script>
